# Mỗi lần nhánh main thay đổi, chép sang nhánh gh-pages để GitHub Pages cập nhật trang web.
name: Đồng bộ trang web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dong-bo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git push --force origin HEAD:gh-pages
